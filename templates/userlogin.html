{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1 style="text-align:center; margin-bottom:25px;">
        Real Time Auction.com
</h1> 

<div class="card" style="max-width:450px; margin:auto; margin-top:60px;">

    <h1 style="text-align:center; margin-bottom:25px;">
        Login
    </h1>

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit" style="width:100%;">
            Login
        </button><br><br>

        {% if loginerror %}

        <p style="color:red; margin-top:-10px; margin-bottom:15px;">
            {{loginerror}}
        </p>

        {% endif %}


        <p style="margin-top:20px; text-align:center;">

        Dont have an account ?

        <a href="/register/">
            Register
        </a>

    </form>

</div>

{% endblock %}
